[project]
name = "commerce-bot"
version = "0.1.0"
description = "Multi-agent e-commerce assistant (Strands + Bedrock + FastAPI)"
readme = "README.md"
requires-python = ">=3.13.7"
dependencies = [
    "boto3>=1.43.28",
    "fastapi>=0.136.3",
    "httpx>=0.28.1",
    "pydantic>=2.13.4",
    "strands-agents>=1.42.0",
    "uvicorn[standard]>=0.49.0",
    "opentelemetry-instrumentation-fastapi>=0.61b0",
    "bedrock-agentcore>=1.14.1",
    "requests>=2.34.2",
    "aws-opentelemetry-distro>=0.10.1",
    "python-dotenv>=1.0.0",
    "tenacity",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]
